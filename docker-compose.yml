services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aigo}
      POSTGRES_USER: ${POSTGRES_USER:-aigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aigo_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - aigo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aigo} -d ${POSTGRES_DB:-aigo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: aigo-api:dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aigo}:${POSTGRES_PASSWORD:-aigo_dev_password}@postgres:5432/${POSTGRES_DB:-aigo}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic -c /app/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: aigo-web:dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - api

volumes:
  aigo_postgres_data: